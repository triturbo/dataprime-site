<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Get in touch with Dataprime Ltd to compare notes on markets, trading, and the systems behind them.">
    <meta name="theme-color" content="#101111">
    <title>Contact — Dataprime</title>
    <link rel="canonical" href="https://dataprime.dev/contact/">
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="/assets/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/styles.css?v=f256343ba1">
    <link rel="stylesheet" href="/contact/contact.css">
    <noscript><style>.contact-address > a { display: none; }</style></noscript>
    <script src="/contact/contact.js" defer></script>
  </head>
  <body class="contact-page">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="masthead">
      <div class="wrap nav-row">
        <a class="wordmark" href="/" aria-label="Dataprime home"><img src="/assets/mark.svg" alt="" width="31" height="31">Dataprime</a>
        <nav class="primary-nav" aria-label="Main navigation">
          <a href="/#practice">Expertise</a>
          <a href="/#notes">Field notes</a>
          <a class="contact-link" href="/contact/" aria-current="page">Contact</a>
        </nav>
      </div>
    </header>

    <main class="wrap contact-main" id="main" tabindex="-1">
      <div class="contact-grid">
        <div class="contact-intro">
          <h1>Contact<span aria-hidden="true">.</span></h1>
          <p>If you’d like to compare notes on trading or the systems behind it, drop us a line.</p>
          <div class="contact-address">
            <a class="email-link" href="mailto:contact@dataprime.dev">contact@dataprime.dev</a>
            <noscript><span class="contact-address-text">contact [at] dataprime.dev</span></noscript>
          </div>
          <div class="contact-actions" hidden>
            <button class="copy-address" type="button"><span class="copy-icon" aria-hidden="true"></span><span>Copy address</span></button>
            <span class="copy-status" role="status"></span>
          </div>
        </div>

        <div class="envelope-grid" aria-hidden="true">
          <div class="envelope"><span></span></div>
        </div>
      </div>

      <div class="contact-details">
        <p>Dataprime Ltd · London, UK</p>
        <a href="/">Back to home</a>
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrap footer-row">
        <span>© Dataprime Ltd</span>
        <a href="/">Home</a>
      </div>
    </footer>
  </body>
</html>
